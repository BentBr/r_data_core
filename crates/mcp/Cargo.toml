[package]
name = "r_data_core_mcp"
version = "0.4.10"
edition = "2021"
description = "MCP server for RDataCore — lets AI assistants author, run and debug workflows"
authors = ["Bent Brüggemann <mail@bent-brueggemann.de>"]
license = "Business"
publish = false  # proprietary — never published to a registry

[[bin]]
name = "r-data-core-mcp"
path = "src/bin/stdio.rs"

[dependencies]
r_data_core_core = { path = "../core" }
r_data_core_workflow = { path = "../workflow" }

# Pinned exactly: the SDK moves fast and the macro/handler shapes differ
# between majors. schemars comes from rmcp's default features rather than a
# direct dependency, so the derive versions cannot diverge.
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
url = "2"
uuid = { version = "1.6", features = ["v7", "serde"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.35", features = ["full", "macros", "rt-multi-thread"] }
