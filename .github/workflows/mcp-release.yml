name: MCP Release

# Tagged separately from the core release cycle: the MCP server is installed by
# people who may never deploy RDataCore themselves, and tying its version to
# the server's would force them to track releases that change nothing for them.
on:
    push:
        tags:
            - 'mcp-v*'
    # So a release can be rehearsed without pushing a tag.
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to build and attach assets to (e.g. mcp-v0.1.0)'
                required: true

permissions:
    contents: write

env:
    # The MCP crate compiles without a database, but the workspace's SQLx
    # queries are checked at build time and would otherwise need one.
    SQLX_OFFLINE: 'true'
    # Release builds never reuse incremental artefacts, and leaving this on
    # grows the cache by tens of gigabytes for no benefit.
    CARGO_INCREMENTAL: '0'

jobs:
    # A dispatched run can name any ref, and this workflow holds
    # `contents: write`. Only someone with write access can dispatch it, so
    # this is a guard rail rather than a boundary — but a typo that checks out
    # an unexpected ref and publishes binaries from it is worth making
    # impossible rather than unlikely.
    guard:
        name: Validate the tag
        runs-on: ubuntu-latest
        steps:
            -   name: Check the tag looks like an MCP release tag
                env:
                    REQUESTED: ${{ inputs.tag || github.ref_name }}
                run: |
                    set -euo pipefail
                    if ! printf '%s' "$REQUESTED" | grep -Eq '^mcp-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
                        echo "Refusing to build '$REQUESTED': expected mcp-vX.Y.Z" >&2
                        exit 1
                    fi

    build:
        name: ${{ matrix.target }}
        needs: guard
        runs-on: ${{ matrix.runner }}
        strategy:
            # One target failing should not hide whether the others work.
            fail-fast: false
            matrix:
                include:
                    -   target: x86_64-unknown-linux-gnu
                        runner: ubuntu-latest
                    -   target: x86_64-apple-darwin
                        runner: macos-latest
                    -   target: aarch64-apple-darwin
                        runner: macos-latest
                    -   target: x86_64-pc-windows-msvc
                        runner: windows-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.tag || github.ref }}

            -   name: Install Rust (nightly)
                uses: dtolnay/rust-toolchain@master
                with:
                    toolchain: nightly
                    targets: ${{ matrix.target }}

            -   name: Show rustc version
                run: rustc -Vv

            -   name: Cache cargo registry + build
                uses: swatinem/rust-cache@v2
                with:
                    workspaces: .
                    key: mcp-release-${{ matrix.target }}

            -   name: Build
                run: cargo build --release -p r_data_core_mcp --target ${{ matrix.target }}

            # Renamed per target so all four can live in one release, and
            # checksummed on the runner that built them — a checksum generated
            # anywhere else would only attest to the upload, not the build.
            -   name: Stage and checksum (unix)
                if: runner.os != 'Windows'
                shell: bash
                run: |
                    set -euo pipefail
                    mkdir -p dist
                    for bin in r-data-core-mcp r-data-core-mcp-serve; do
                        cp "target/${{ matrix.target }}/release/${bin}" \
                           "dist/${bin}-${{ matrix.target }}"
                    done
                    cd dist
                    shasum -a 256 ./* > "SHA256SUMS-${{ matrix.target }}"
                    cat "SHA256SUMS-${{ matrix.target }}"

            -   name: Stage and checksum (windows)
                if: runner.os == 'Windows'
                shell: bash
                run: |
                    set -euo pipefail
                    mkdir -p dist
                    for bin in r-data-core-mcp r-data-core-mcp-serve; do
                        cp "target/${{ matrix.target }}/release/${bin}.exe" \
                           "dist/${bin}-${{ matrix.target }}.exe"
                    done
                    cd dist
                    sha256sum ./* > "SHA256SUMS-${{ matrix.target }}"
                    cat "SHA256SUMS-${{ matrix.target }}"

            -   name: Upload artefacts
                uses: actions/upload-artifact@v4
                with:
                    name: mcp-${{ matrix.target }}
                    path: dist/
                    if-no-files-found: error

    publish:
        name: Publish release
        needs: build
        runs-on: ubuntu-latest
        steps:
            -   name: Download every target's artefacts
                uses: actions/download-artifact@v4
                with:
                    path: staged

            # The per-target checksum files are concatenated rather than
            # regenerated: regenerating here would checksum whatever arrived,
            # which is precisely what the file is supposed to let someone
            # verify independently.
            -   name: Assemble release assets
                shell: bash
                run: |
                    set -euo pipefail
                    mkdir -p dist
                    find staged -type f ! -name 'SHA256SUMS-*' -exec cp {} dist/ \;
                    find staged -type f -name 'SHA256SUMS-*' -exec cat {} + \
                        | sed 's#\./##' > dist/SHA256SUMS
                    echo "── assets ──"
                    ls -l dist
                    echo "── SHA256SUMS ──"
                    cat dist/SHA256SUMS

            -   name: Attach to the release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ inputs.tag || github.ref_name }}
                    files: dist/*
                    fail_on_unmatched_files: true
