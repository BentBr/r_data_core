name: MCP Release

# Tagged separately from the core release cycle: the MCP server is installed by
# people who may never deploy RDataCore themselves, and tying its version to
# the server's would force them to track releases that change nothing for them.
on:
    push:
        tags:
            - 'mcp-v*'
    # So a release can be rehearsed without pushing a tag.
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to build and attach assets to (e.g. mcp-v0.1.0)'
                required: true

# Deliberately NOT exposed as a reusable workflow. release-please pushes the
# mcp-v* tag with a GitHub App token so the push trigger above fires, rather
# than calling this file: npm trusted publishing matches the OIDC token's
# workflow_ref against the registered publisher, and for a called workflow
# that claim names the caller. Publishing therefore only works while this
# workflow is its own entry point.

permissions:
    contents: read

env:
    # The MCP crate compiles without a database, but the workspace's SQLx
    # queries are checked at build time and would otherwise need one.
    SQLX_OFFLINE: 'true'
    # Release builds never reuse incremental artefacts, and leaving this on
    # grows the cache by tens of gigabytes for no benefit.
    CARGO_INCREMENTAL: '0'

jobs:
    # A tag can be pushed by anyone with write access, and this workflow
    # publishes whatever it points at. So the tag must be a release commit on
    # main — checked by script, so the same check runs in a local test.
    guard:
        name: Validate the tag
        runs-on: ubuntu-latest
        permissions:
            contents: read
        # Every later checkout uses this commit, not the tag name: a tag moved
        # after this job passed must not change what gets built and published.
        outputs:
            tag_sha: ${{ steps.verify.outputs.tag_sha }}
        steps:
            -   name: Checkout with history
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
                with:
                    ref: ${{ inputs.tag || github.ref }}
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Refuse a tag that is not a release commit on main
                id: verify
                env:
                    REQUESTED: ${{ inputs.tag || github.ref_name }}
                run: |
                    set -euo pipefail
                    git fetch --no-tags origin main:refs/remotes/origin/main
                    git fetch origin "refs/tags/${REQUESTED}:refs/tags/${REQUESTED}" || true
                    ./.github/scripts/check-release-tag.sh "$REQUESTED"
                    echo "tag_sha=$(git rev-parse "refs/tags/${REQUESTED}^{commit}")" >> "$GITHUB_OUTPUT"

    build:
        name: ${{ matrix.target }}
        needs: guard
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
        strategy:
            # One target failing should not hide whether the others work.
            fail-fast: false
            matrix:
                include:
                    -   target: x86_64-unknown-linux-gnu
                        runner: ubuntu-latest
                    # Native rather than cross-compiled: a cross build would need
                    # an aarch64 linker, and any *-sys crate in the graph would
                    # otherwise pick up the host's C libraries. GitHub's arm
                    # runners are free for public repositories, so the native
                    # route costs nothing it saves.
                    -   target: aarch64-unknown-linux-gnu
                        runner: ubuntu-24.04-arm
                    -   target: x86_64-apple-darwin
                        runner: macos-latest
                    -   target: aarch64-apple-darwin
                        runner: macos-latest
                    -   target: x86_64-pc-windows-msvc
                        runner: windows-latest

        steps:
            -   name: Require the verified commit
                env:
                    TAG_SHA: ${{ needs.guard.outputs.tag_sha }}
                shell: bash
                run: |
                    # An empty ref would make checkout fall back to the triggering ref.
                    [ -n "$TAG_SHA" ] || { echo "guard produced no tag_sha" >&2; exit 1; }

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
                with:
                    persist-credentials: false
                    ref: ${{ needs.guard.outputs.tag_sha }}

            -   name: Install Rust (nightly)
                uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f  # master (Dependabot refreshes this pin)
                with:
                    toolchain: nightly
                    targets: ${{ matrix.target }}

            -   name: Show rustc version
                run: rustc -Vv

            -   name: Cache cargo registry + build
                uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
                with:
                    workspaces: .
                    key: mcp-release-${{ matrix.target }}

            -   name: Build
                run: cargo build --release -p r_data_core_mcp --target ${{ matrix.target }}

            # Renamed per target so all four can live in one release, and
            # checksummed on the runner that built them — a checksum generated
            # anywhere else would only attest to the upload, not the build.
            -   name: Stage and checksum (unix)
                if: runner.os != 'Windows'
                shell: bash
                run: |
                    set -euo pipefail
                    mkdir -p dist
                    for bin in r-data-core-mcp r-data-core-mcp-serve; do
                        cp "target/${{ matrix.target }}/release/${bin}" \
                           "dist/${bin}-${{ matrix.target }}"
                    done
                    cd dist
                    # Named explicitly rather than globbed: `./*` would also
                    # match the checksum file being written, and whether it
                    # does depends on expansion order.
                    shasum -a 256 r-data-core-mcp-* > "SHA256SUMS-${{ matrix.target }}"
                    cat "SHA256SUMS-${{ matrix.target }}"

            -   name: Stage and checksum (windows)
                if: runner.os == 'Windows'
                shell: bash
                run: |
                    set -euo pipefail
                    mkdir -p dist
                    for bin in r-data-core-mcp r-data-core-mcp-serve; do
                        cp "target/${{ matrix.target }}/release/${bin}.exe" \
                           "dist/${bin}-${{ matrix.target }}.exe"
                    done
                    cd dist
                    sha256sum r-data-core-mcp-* > "SHA256SUMS-${{ matrix.target }}"
                    cat "SHA256SUMS-${{ matrix.target }}"

            -   name: Upload artefacts
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
                with:
                    name: mcp-${{ matrix.target }}
                    path: dist/
                    if-no-files-found: error

    publish:
        name: Publish release
        needs: [guard, build]
        runs-on: ubuntu-latest
        # Required reviewers live on this environment (operator step D7);
        # npm's trusted publisher is bound to it as well.
        environment: release
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            -   name: Require the verified commit
                env:
                    TAG_SHA: ${{ needs.guard.outputs.tag_sha }}
                shell: bash
                run: |
                    # An empty ref would make checkout fall back to the triggering ref.
                    [ -n "$TAG_SHA" ] || { echo "guard produced no tag_sha" >&2; exit 1; }

            # Needed for .github/scripts/publish-to-pages.sh; the build jobs
            # check out for their own reasons, this job otherwise would not.
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
                with:
                    persist-credentials: false
                    ref: ${{ needs.guard.outputs.tag_sha }}

            # Scoped to this workflow's own artefacts. Without the pattern
            # it downloads everything in the run, and since release-please
            # now calls this workflow alongside docker-publish, that run also
            # contains docker/build-push-action's *.dockerbuild records —
            # which is what failed the download after five retries.
            -   name: Download every target's artefacts
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
                with:
                    path: staged
                    pattern: mcp-*

            # The per-target checksum files are concatenated rather than
            # regenerated: regenerating here would checksum whatever arrived,
            # which is precisely what the file is supposed to let someone
            # verify independently.
            -   name: Assemble release assets
                shell: bash
                run: |
                    set -euo pipefail
                    mkdir -p dist
                    find staged -type f ! -name 'SHA256SUMS-*' -exec cp {} dist/ \;
                    find staged -type f -name 'SHA256SUMS-*' -exec cat {} + \
                        | sed 's#\./##' > dist/SHA256SUMS
                    echo "── assets ──"
                    ls -l dist
                    echo "── SHA256SUMS ──"
                    cat dist/SHA256SUMS

            # Releases are immutable by policy (and by repository setting —
            # operator step 3 in docs/MCP.md). A re-run against a tag that
            # already carries assets must stop here, before anything is
            # replaced, rather than quietly rewrite binaries and sums together.
            -   name: Refuse to overwrite an existing release's assets
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    TAG: ${{ inputs.tag || github.ref_name }}
                shell: bash
                run: |
                    set -euo pipefail
                    # A missing release is fine (nothing to overwrite); any
                    # other failure must not be read as "no assets".
                    if ! out="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length' 2>&1)"; then
                        case "$out" in
                            *"release not found"*) out=0 ;;
                            *) echo "::error::could not inspect release $TAG: $out" >&2; exit 1 ;;
                        esac
                    fi
                    if [ "$out" != "0" ]; then
                        echo "::error::release $TAG already has $out asset(s). Releases are immutable; cut a new version." >&2
                        exit 1
                    fi

            # Signed statement that these exact bytes came from this workflow
            # run of this commit. Verifiable with `gh attestation verify`.
            -   name: Attest build provenance
                uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
                with:
                    subject-path: |
                        dist/r-data-core-mcp-*
                        dist/SHA256SUMS

            -   name: Keep the checksums for the npm job
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
                with:
                    name: mcp-sha256sums
                    path: dist/SHA256SUMS
                    if-no-files-found: error

            # rdatacore.eu links download URLs and cannot resolve "the newest
            # mcp-v* release" itself: GitHub's `releases/latest` is the newest
            # release of *any* series in this repository, which is usually a
            # core release carrying none of these assets. A manifest at a fixed
            # address means the website never has to be redeployed for a
            # release.
            -   name: Build the download manifest
                env:
                    TAG: ${{ inputs.tag || github.ref_name }}
                shell: bash
                run: |
                    set -euo pipefail
                    base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
                    {
                        echo '{'
                        printf '  "version": "%s",\n' "${TAG#mcp-v}"
                        printf '  "tag": "%s",\n' "$TAG"
                        printf '  "published_at": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                        printf '  "npm": "@rdatacore/mcp-server",\n'
                        echo '  "downloads": ['
                        first=1
                        while read -r sum name; do
                            [ -n "${name:-}" ] || continue
                            case "$name" in SHA256SUMS*|mcp-latest.json) continue ;; esac
                            [ $first -eq 1 ] || echo ','
                            first=0
                            printf '    {"asset": "%s", "sha256": "%s", "url": "%s/%s"}' \
                                   "$name" "$sum" "$base" "$name"
                        done < dist/SHA256SUMS
                        echo
                        echo '  ]'
                        echo '}'
                    } > dist/mcp-latest.json
                    # Fail the release rather than publish a manifest no
                    # consumer can parse.
                    python3 -m json.tool dist/mcp-latest.json > /dev/null
                    cat dist/mcp-latest.json

            -   name: Attach to the release
                uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
                with:
                    tag_name: ${{ inputs.tag || github.ref_name }}
                    files: dist/*
                    fail_on_unmatched_files: true

            # A release asset URL contains the tag, so it is not a fixed
            # address. This one is:
            #   https://bentbr.github.io/r_data_core/mcp-latest.json
            # Uses the same script as the coverage badges rather than a second
            # mechanism for writing the same branch.
            -   name: Publish the manifest to gh-pages
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    REPO: ${{ github.repository }}
                    TAG: ${{ inputs.tag || github.ref_name }}
                run: |
                    # Absolute path: the script cds to /tmp before copying,
                    # so a relative source resolves against the wrong
                    # directory. The coverage callers pass /tmp/... for the
                    # same reason.
                    ./.github/scripts/publish-to-pages.sh \
                        mcp-latest.json "${GITHUB_WORKSPACE}/dist/mcp-latest.json" \
                        "MCP manifest" \
                        "chore(mcp): publish the ${TAG} download manifest"

    # Gated on `publish`, because postinstall downloads the binaries from the
    # GitHub release: npm must never carry a version whose assets do not yet
    # exist, or the first `npx` of it fails with "no published mcp-v* release".
    npm:
        name: Publish to npm
        needs: [guard, publish]
        runs-on: ubuntu-latest
        # Required reviewers live on this environment (operator step D7);
        # npm's trusted publisher is bound to it as well.
        environment: release
        permissions:
            contents: read
            # Trusted publishing: npm mints a short-lived credential from this
            # token, so no long-lived secret sits in the repository and the
            # published version carries a provenance attestation. Register the
            # publisher on the package's npm settings page first — until then
            # this job cannot authenticate.
            id-token: write
        steps:
            -   name: Require the verified commit
                env:
                    TAG_SHA: ${{ needs.guard.outputs.tag_sha }}
                shell: bash
                run: |
                    # An empty ref would make checkout fall back to the triggering ref.
                    [ -n "$TAG_SHA" ] || { echo "guard produced no tag_sha" >&2; exit 1; }

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
                with:
                    persist-credentials: false
                    ref: ${{ needs.guard.outputs.tag_sha }}

            # The installer verifies downloads against this copy, which npm's
            # provenance covers. A checksum file fetched from the release would
            # only prove it was uploaded alongside the binaries.
            -   name: Download the release checksums
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
                with:
                    name: mcp-sha256sums
                    path: mcp-npm-package/

            -   name: Refuse to publish without checksums
                working-directory: mcp-npm-package
                run: |
                    set -euo pipefail
                    test -s SHA256SUMS
                    grep -c 'r-data-core-mcp-' SHA256SUMS

            # No registry-url, deliberately. setup-node always writes
            # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} when it is
            # given one, and with trusted publishing there is no token — so it
            # expands to empty, npm decides auth is already configured, skips
            # the OIDC exchange and publishes anonymously. The registry then
            # answers 404 rather than 403, to avoid disclosing whether the
            # package exists, which is the error this spent three releases on.
            # npm defaults to registry.npmjs.org regardless.
            # See actions/setup-node#1551 and npm/documentation#1960.
            -   name: Setup Node.js
                uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
                with:
                    node-version: '22'

            # Trusted publishing is OIDC, and npm only learned it in 11.5.1.
            # setup-node ships whatever npm the Node release bundles — Node 22
            # carries npm 10 — which has no OIDC support and no token to fall
            # back on, so `npm publish` goes out unauthenticated and the
            # registry answers 404 rather than 401, to avoid disclosing
            # whether the package exists.
            -   name: Install an npm that can do trusted publishing
                run: |
                    set -euo pipefail
                    npm install -g npm@^11
                    version="$(npm --version)"
                    echo "npm ${version}"
                    # Trusted publishing is OIDC, which npm learned in 11.5.1.
                    # Asserted rather than assumed: an older npm does not fail,
                    # it publishes anonymously and 404s, which reads like a
                    # permissions problem and is not.
                    major="${version%%.*}"
                    rest="${version#*.}"
                    minor="${rest%%.*}"
                    if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
                        echo "npm ${version} cannot do trusted publishing; need >= 11.5.1" >&2
                        exit 1
                    fi

            -   name: Leave no credential for npm to prefer over OIDC
                run: |
                    set -euo pipefail
                    # Belt and braces: if registry-url is ever restored above,
                    # or a runner image ships an .npmrc, this keeps the OIDC
                    # path open rather than silently falling back.
                    for f in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc"; do
                        [ -n "$f" ] && [ -f "$f" ] || continue
                        sed -i '/_authToken/d' "$f"
                        echo "stripped any _authToken from $f"
                    done
                env:
                    NODE_AUTH_TOKEN: ''

            # The tag and the manifest are edited by different hands at
            # different times. Publishing 0.1.0 under the tag mcp-v0.2.0 would
            # ship an installer that downloads assets it does not name.
            -   name: Refuse a version that disagrees with the tag
                env:
                    TAG: ${{ inputs.tag || github.ref_name }}
                working-directory: mcp-npm-package
                run: |
                    set -euo pipefail
                    manifest=$(node -p "require('./package.json').version")
                    if [ "$manifest" != "${TAG#mcp-v}" ]; then
                        echo "package.json is $manifest but the tag says ${TAG#mcp-v}" >&2
                        exit 1
                    fi
                    echo "version $manifest matches $TAG"

            -   name: Publish
                working-directory: mcp-npm-package
                run: npm publish
