name: Lint workflows

# The workflows are the release supply chain. They get the same gate as code.
on:
    pull_request:
        paths:
            - '.github/**'
    push:
        branches: [ main ]
        paths:
            - '.github/**'

permissions:
    contents: read

jobs:
    zizmor:
        name: zizmor
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    persist-credentials: false
            -   uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
                with:
                    version: '1.30.1'
                    persona: regular
                    min-severity: medium
                    advanced-security: 'false'
                    online-audits: 'false'

    actionlint:
        name: actionlint
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    persist-credentials: false
            -   uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
                with:
                    # actionlint v1.7.12 requires Go >= 1.25 (GOTOOLCHAIN=local)
                    go-version: '1.25'
            # Installed through the Go module proxy, so the binary is pinned by
            # version and verified by the checksum database — rather than a
            # curl | bash in the one workflow that lints the others.
            -   run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
            # Shellcheck disabled for now: it reports 56 findings in run:
            # blocks that predate this gate. Follow-up: fix them in a
            # dedicated PR and drop `-shellcheck=` here.
            -   run: actionlint -color -shellcheck=

    secret-scope:
        name: Release App key confined
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    persist-credentials: false
            -   run: ./.github/scripts/check-app-secret-scope.sh
            -   run: bash .github/scripts/tests/check-app-secret-scope_test.sh && bash .github/scripts/tests/check-release-tag_test.sh
