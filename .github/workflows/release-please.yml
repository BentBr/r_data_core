name: Release Please

on:
    push:
        branches:
            - main

# Least privilege: every job below declares the scopes it needs.
permissions:
    contents: read

jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            # Reads the PR head's combined commit status to decide whether
            # ci-gate still has to be posted.
            statuses: read
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            version: ${{ steps.release.outputs.version }}
            prs_created: ${{ steps.release.outputs.prs_created }}
            prs: ${{ steps.release.outputs.prs }}
            pr_head_sha: ${{ steps.get-pr-sha.outputs.sha }}
        steps:
            -   name: Release Please
                id: release
                uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
                with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    config-file: release-please-config.json
                    manifest-file: .release-please-manifest.json

            -   name: Debug outputs
                env:
                    RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
                    VERSION: ${{ steps.release.outputs.version }}
                    TAG_NAME: ${{ steps.release.outputs.tag_name }}
                    PRS_CREATED: ${{ steps.release.outputs.prs_created }}
                    PRS_JSON: ${{ steps.release.outputs.prs }}
                run: |
                    echo "=== Release Outputs ==="
                    echo "release_created: $RELEASE_CREATED"
                    echo "version: $VERSION"
                    echo "tag_name: $TAG_NAME"
                    echo ""
                    echo "=== PR Tracking ==="
                    echo "PRs created: $PRS_CREATED"
                    echo "PRs: $PRS_JSON"

            -   name: Resolve release PR head needing CI
                id: get-pr-sha
                # Runs on every push-to-main release-please run (not only when the
                # PR was just created) so a PR left without a ci-gate status can
                # self-heal on a later push. Skipped when a release is being cut.
                if: ${{ steps.release.outputs.release_created != 'true' }}
                uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
                env:
                    PRS_OUTPUT: ${{ steps.release.outputs.prs }}
                with:
                    script: |
                        const { owner, repo } = context.repo;
                        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

                        // Identify the open release-please PR: prefer this run's
                        // output; otherwise find the open PR on a release branch.
                        let prNumber = null;
                        const prsOutput = process.env.PRS_OUTPUT;
                        if (prsOutput) {
                          try {
                            const prs = JSON.parse(prsOutput);
                            if (Array.isArray(prs) && prs.length > 0) {
                              prNumber = prs[0].number;
                            }
                          } catch (e) {
                            core.info(`Could not parse PRS_OUTPUT: ${e.message}`);
                          }
                        }
                        if (!prNumber) {
                          const { data: open } = await github.rest.pulls.list({
                            owner, repo, state: 'open', per_page: 50,
                          });
                          const relPr = open.find((p) => p.head.ref.startsWith('release-please--'));
                          if (!relPr) {
                            core.info('No open release-please PR found; nothing to do.');
                            return;
                          }
                          prNumber = relPr.number;
                        }

                        const { data: pr } = await github.rest.pulls.get({
                          owner, repo, pull_number: prNumber,
                        });
                        const branch = pr.head.ref;

                        // release-please force-pushes the release branch, and the
                        // PR head field can lag (read-after-write). Resolve the
                        // branch ref directly and poll until two reads agree, so we
                        // never post ci-gate on a stale SHA.
                        let last = null;
                        let sha = null;
                        for (let i = 0; i < 8; i++) {
                          const { data: ref } = await github.rest.git.getRef({
                            owner, repo, ref: `heads/${branch}`,
                          });
                          const cur = ref.object.sha;
                          core.info(`poll ${i}: ${branch} -> ${cur}`);
                          if (cur === last) { sha = cur; break; }
                          last = cur;
                          await sleep(5000);
                        }
                        sha = sha || last;
                        if (!sha) {
                          core.info('Could not resolve branch head SHA.');
                          return;
                        }

                        // Self-heal guard: only (re)run CI when the current head
                        // lacks a successful ci-gate status, so routine main pushes
                        // do not redundantly re-run CI on an already-green head.
                        const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                          owner, repo, ref: sha,
                        });
                        const gate = combined.statuses.find((s) => s.context === 'ci-gate');
                        if (gate && gate.state === 'success') {
                          core.info(`ci-gate already success on ${sha}; nothing to do.`);
                          return;
                        }

                        core.setOutput('sha', sha);
                        core.info(`PR #${prNumber} (${branch}) head ${sha} needs ci-gate (current: ${gate ? gate.state : 'none'}).`);

    # Run CI for release-please PRs (GITHUB_TOKEN events don't trigger other workflows)
    ci-for-release-pr:
        needs: release-please
        if: ${{ needs.release-please.outputs.pr_head_sha != '' && needs.release-please.outputs.release_created != 'true' }}
        uses: ./.github/workflows/ci.yml
        # Matches ci.yml's own workflow-level grant; a called workflow cannot
        # exceed what its caller gives it.
        permissions:
            contents: read
            statuses: write

    # Report CI status to the PR (called workflows don't create status checks)
    report-ci-status:
        needs: [ release-please, ci-for-release-pr ]
        if: ${{ always() && needs.release-please.outputs.pr_head_sha != '' && needs.release-please.outputs.release_created != 'true' }}
        runs-on: ubuntu-latest
        permissions:
            statuses: write
        steps:
            -   name: Report CI status to PR
                uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
                with:
                    script: |
                        const sha = '${{ needs.release-please.outputs.pr_head_sha }}';
                        const ciResult = '${{ needs.ci-for-release-pr.result }}';

                        if (!sha) {
                          console.log('No SHA available, skipping status update');
                          return;
                        }

                        const state = ciResult === 'success' ? 'success' :
                                      ciResult === 'failure' ? 'failure' :
                                      ciResult === 'cancelled' ? 'error' : 'pending';

                        const description = ciResult === 'success' ? 'All CI checks passed' :
                                           ciResult === 'failure' ? 'CI checks failed' :
                                           ciResult === 'cancelled' ? 'CI was cancelled' : 'CI is running';

                        await github.rest.repos.createCommitStatus({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          sha: sha,
                          state: state,
                          context: 'ci-gate',
                          description: description,
                          target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                        });

                        console.log(`Set commit status for ${sha}: ${state}`);

    # Mirror the core tag into the mcp-v* series that mcp-release.yml listens
    # on.
    #
    # Pushed with the *release* App's token — an App that holds `contents: write`
    # and that the mcp-v* tag ruleset trusts. Its ID and key are environment
    # secrets of `release-tag`, whose deployment policy allows `main` only, so
    # a workflow run on any other branch cannot read them even if it names
    # them (check-app-secret-scope.sh additionally keeps the key's name in
    # this one job). The PR-management App is a different App with no write
    # access to contents.
    #
    # An App token is used rather than the default GITHUB_TOKEN:
    # GitHub suppresses workflow runs for refs pushed by GITHUB_TOKEN to
    # prevent recursion, so that tag would appear and mcp-release.yml would
    # never start. An App-pushed tag is an ordinary push and does trigger it.
    #
    # The alternative — calling mcp-release.yml as a reusable workflow — was
    # tried and breaks npm trusted publishing: the OIDC token of a called
    # workflow carries the *caller* in its workflow_ref, so the claim reads
    # release-please.yml while npm has mcp-release.yml registered, the token
    # exchange is refused, and npm falls through to an anonymous publish that
    # fails with ENEEDAUTH. mcp-release.yml has to be its own entry point.
    #
    # release-please's rust strategy upgrades every Cargo workspace member and
    # offers no way to exclude one, so crates/mcp always carries the core
    # version — an attempt to register it as its own release-please package
    # would just have two packages writing the same file. Rather than fight
    # that, the MCP server is versioned with the core and its tag is derived
    # from the same release, so no one has to tag by hand.
    #
    # The cost is an MCP release on every core release, including ones that
    # change nothing in crates/mcp. That is the trade for a release process
    # that runs unattended.
    mcp-tag:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        # Holds the release App's secrets. Deployment branches: main only; no
        # reviewers, so tagging stays unattended. If the environment does not
        # exist GitHub creates it empty and this job fails closed.
        environment: release-tag
        # The tag is pushed with the App token, not GITHUB_TOKEN, so the
        # default token needs nothing beyond read here.
        permissions:
            contents: read
        steps:
            -   name: Generate App token
                id: app-token
                uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
                with:
                    app-id: ${{ secrets.RELEASE_APP_ID }}
                    private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                    # Pushing a tag is all this token is for.
                    permission-contents: write

            # The App token is persisted on purpose: the next step pushes the
            # tag with it. Nothing in this job uploads an artefact, and the
            # token is scoped to contents and expires within the hour.
            -   name: Checkout the release commit  # zizmor: ignore[artipacked]
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
                with:
                    ref: ${{ needs.release-please.outputs.tag_name }}
                    token: ${{ steps.app-token.outputs.token }}

            -   name: Tag the MCP release
                env:
                    VERSION: ${{ needs.release-please.outputs.version }}
                run: |
                    set -euo pipefail
                    tag="mcp-v${VERSION}"
                    # Idempotent: a re-run of this job must not fail the
                    # release, and the tag already existing means the work is
                    # done rather than that something is wrong.
                    if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
                        echo "${tag} already exists; nothing to do"
                        exit 0
                    fi
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git tag -a "${tag}" -m "MCP server ${VERSION}"
                    git push origin "${tag}"
                    echo "pushed ${tag}"

    # Build and publish Docker images when a release is created
    docker-publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        uses: ./.github/workflows/docker-publish.yml
        permissions:
            contents: write
            packages: write
            id-token: write
            attestations: write
        with:
            version: ${{ needs.release-please.outputs.version }}
            tag_name: ${{ needs.release-please.outputs.tag_name }}
            build_backend: true
            build_frontend: true
        # No secrets: docker-publish.yml only uses GITHUB_TOKEN, which a
        # called workflow receives regardless. `secrets: inherit` would hand
        # it every repository secret as well.
